
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="week5_ex02_style.css">
</head>
<body>
    <div class="container">
        <h1>Image Gallery</h1>
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="landscape">Landscapes</button>
            <button class="filter-btn" data-filter="portrait">Portraits</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
        </div>

        <div class="gallery-grid" id="gallery">
            <!-- 12 images will be inserted via JS -->
        </div>
    </div>

    <script>
        const images = [ 
            { https://unsplash.com/photos/river-flowing-through-a-vast-rocky-canyon-landscape-IvV_gdTuYMA } 
            { https://unsplash.com/photos/stepping-stones-lead-to-a-doorway-with-modern-architecture-I1dmCddUDEQ }
            { https://unsplash.com/photos/window-frame-JsyynebK_2E } 
            { https://unsplash.com/photos/geometric-pyramid-structure-with-birds-on-top-FIQWgHlTkGI } 
            { https://unsplash.com/photos/a-black-and-white-photo-of-a-building-reflecting-in-a-pool-fRTaDntQKzg }
            { https://unsplash.com/photos/a-large-building-with-columns-and-a-clock-on-the-wall-nOXqc6uP1tY ] 
            { https://unsplash.com/photos/gray-concrete-building-near-bod-y-of-ter-uShcDKPSaCE } 
            { https://unsplash.com/photos/a-very-tall-mountain-with-some-clouds-in-the-sky-p-63QjIgZE0 } 
            { https://unsplash.com/photos/a-black-and-white-photo-of-a-walkway-j3sFovuH7kM } 
            { https://unsplash.com/photos/a-couple-of-tall-white-buildings-sitting-next-to-each-other-bFtIuUilgzQ } 
            { https://unsplash.com/photos/a-view-of-the-sky-from-inside-a-cave-LkUDbk93Eq8 }
            { https://unsplash.com/photos/a-computer-generated-image-of-a-building-with-stairs-QGAK11ZyLwA }
       ];

        const gallery = document.getElementById('gallery');
        const filterBtns = document.querySelectorAll('.filter-btn');
        let currentFilter = 'all';

        function renderGallery() {
            const filtered = currentFilter === 'all' 
                ? images 
                : images.filter(img => img.category === currentFilter);
            
            gallery.innerHTML = filtered.map(img => `
                <div class="card" data-category="${img.category}">
                    <div class="card-inner">
                        <img src="${img.src}" alt="${img.title}" loading="lazy">
                        <div class="overlay">
                            <p>${img.desc}</p>
                        </div>
                    </div>
                    <div class="card-info">
                        <h3>${img.title}</h3>
                        <span class="category-tag">${img.category}</span>
                    </div>
                </div>
            `).join('');
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGallery();
            });
        });

        renderGallery();
    </script>
</body>
</html>
