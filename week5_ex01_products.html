<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase</title>
  <link rel="stylesheet" href="week5_ex01_style.css">
</head>
<body>
  <header>
    <h1>Product Showcase</h1>
  </header>

  <main class="product-grid">
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 1">
      <h3>Product Name</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 2">
      <h3>Product Name</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 3">
      <h3>Product Name</h3>
      <p>$39.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 4">
      <h3>Product Name</h3>
      <p>$49.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 5">
      <h3>Product Name</h3>
      <p>$59.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://placehold.co/300x200" alt="Product 6">
      <h3>Product Name</h3>
      <p>$69.99</p>
      <button>Add to Cart</button>
    </div>
  </main>
</body>
</html>
