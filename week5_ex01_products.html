<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mzansi Product Showcase</title>
    <link rel="stylesheet" href="week5_ex01_style.css">
</head>
<body>
    <header>
        <h1>🔥 SA Lokal Goods 🔥</h1>
        <p>Proudly South African — support local makers</p>
    </header>

    <main class="product-grid">
        <!-- Card 1 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/1e3a2f/white?text=Marula+Oil" alt="Marula Oil product">
            <h3>Marula Miracle Oil</h3>
            <p class="price">R 149.99</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>

        <!-- Card 2 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/8b5a2b/white?text=Biltong" alt="Biltong pack">
            <h3>Classic Beef Biltong</h3>
            <p class="price">R 89.99</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>

        <!-- Card 3 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/2c3e50/white?text=Springbok+Skins" alt="Springbok skin rug">
            <h3>Springbok Skin Rug</h3>
            <p class="price">R 1,299.00</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>

        <!-- Card 4 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/d35400/white?text=Rooibos+Tea" alt="Rooibos tea box">
            <h3>Rooibos Organic Tea</h3>
            <p class="price">R 55.00</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>

        <!-- Card 5 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/27ae60/white?text=Shweshwe+Fabric" alt="Shweshwe fabric">
            <h3>Shweshwe Print Fabric</h3>
            <p class="price">R 129.50</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>

        <!-- Card 6 -->
        <div class="product-card">
            <img src="https://placehold.co/300x200/a04000/white?text=Amarula+Liqueur" alt="Amarula bottle">
            <h3>Amarula Cream Liqueur</h3>
            <p class="price">R 219.99</p>
            <button class="add-to-cart">Add to Cart 🛒</button>
        </div>
    </main>
</body>
</html>
